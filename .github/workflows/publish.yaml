name: Publish Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint ./charts/cheesedb

  publish:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Render chart templates
        run: |
          helm template cheesedb ./charts/cheesedb \
            --namespace cheesedb \
            --output-dir ./public

      - name: Generate index.yaml
        run: |
          helm package ./charts/cheesedb --destination ./public
          helm repo index ./public --url https://govinargo-labs.github.io/cheesedb-helm

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
