{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cheesedb.fullname" . }}
  labels:
    {{- include "cheesedb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cheesedb.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: https
      {{- with .Values.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # The server calls nothing: no model, no outside service.
  egress: []
{{- end }}
