{{- if .Values.networkPolicy.enabled }}
{{- /* An ingress rule with no "from" lets every source in, the opposite of
       what turning the policy on promises. */}}
{{- if not .Values.networkPolicy.from }}
{{- fail "networkPolicy.enabled needs at least one peer in networkPolicy.from: with none, every pod could reach the server" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cheesedb.fullname" . }}
  labels:
    {{- include "cheesedb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cheesedb.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: https
      from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
  # The server calls nothing: no model, no outside service.
  egress: []
{{- end }}
