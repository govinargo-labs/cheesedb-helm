{{- if not .Values.admin.existingSecret }}
{{- $name := include "cheesedb.adminSecret" . }}
{{- $data := dict }}
{{- if .Values.admin.keyHash }}
{{- if not (regexMatch "^[0-9a-f]{64}$" .Values.admin.keyHash) }}
{{- fail "admin.keyHash must be 64 lowercase hex characters: the SHA-256 of the admin token" }}
{{- end }}
{{- $_ := set $data "admin.key" .Values.admin.keyHash }}
{{- else }}
{{- /* Keep the token made at the first install: a new one on every
       upgrade would lock the admin out. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := "" }}
{{- if and $old (index $old.data "admin-token") }}
{{- $token = index $old.data "admin-token" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- $_ := set $data "admin-token" $token }}
{{- $_ := set $data "admin.key" (sha256sum $token) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cheesedb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
